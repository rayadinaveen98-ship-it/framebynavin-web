name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/framebynavin-next.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/homepage.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/framebynavin-next.log
          exit 1

      - name: Smoke test homepage
        run: |
          grep -q "SEE THE" /tmp/homepage.html
          grep -q "FRAMEBYNAVIN" /tmp/homepage.html
          grep -q "Cinema" /tmp/homepage.html
          grep -q "Stories" /tmp/homepage.html
          grep -q "Apps" /tmp/homepage.html
          grep -q "Games" /tmp/homepage.html

      - name: Capture desktop and mobile renders
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,6000 --screenshot=homepage-desktop.png http://127.0.0.1:3000/
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,6000 --screenshot=homepage-mobile.png http://127.0.0.1:3000/

      - name: Upload visual verification
        uses: actions/upload-artifact@v4
        with:
          name: homepage-renders
          path: |
            homepage-desktop.png
            homepage-mobile.png
          if-no-files-found: error
